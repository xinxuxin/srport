[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epnet-demo"
version = "0.1.0"
description = "EPNet single-image super-resolution demo with PyTorch, FastAPI, and Next.js."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "numpy>=1.24,<3.0",
  "pillow>=10.0,<12.0",
  "pydantic>=2.6,<3.0",
  "pyyaml>=6.0,<7.0",
  "python-multipart>=0.0.9,<1.0",
  "torch>=2.1,<3.0",
  "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.9,<2.0",
  "pytest>=8.1,<9.0",
  "ruff>=0.4,<1.0",
]

[project.scripts]
epnet-train = "epnet.train:main"
epnet-eval = "epnet.evaluate:main"
epnet-infer = "epnet.infer:main"
epnet-ablate = "epnet.ablate:main"
epnet-profile = "epnet.profile:main"
epnet-export = "epnet.export:main"
epnet = "epnet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["UP045"]

[tool.mypy]
python_version = "3.9"
packages = ["epnet", "epnet_api"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
