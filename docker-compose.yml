services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      EPNET_CHECKPOINT_PATH: /app/checkpoints/demo_x4.pt
      EPNET_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./outputs:/app/outputs
      - ./checkpoints:/app/checkpoints

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
