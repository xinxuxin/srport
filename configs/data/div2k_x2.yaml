# Real-data x2 training/evaluation config based on DIV2K HR inputs.
dataset_type: div2k
dataset_root: data
# HR source directory used for training crops.
train_hr_dir: data/raw/DIV2K/DIV2K_train_HR
# Bicubic LR caches are materialized here for reproducible paired loading.
processed_root: data/processed
scale: 2
# Benchmark roots used by the evaluation pipeline after training.
benchmark_roots:
  Set5: data/benchmarks/Set5/HR
  Set14: data/benchmarks/Set14/HR
  BSD100: data/benchmarks/BSD100/HR
  Urban100: data/benchmarks/Urban100/HR
  Manga109: data/benchmarks/Manga109/HR
